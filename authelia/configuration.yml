###############################################################
#                   Authelia Configuration                    #
###############################################################

theme: dark

server:
  address: "tcp://0.0.0.0:9091/"

log:
  level: info

# jwt_secret → env: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
# session.secret → env: AUTHELIA_SESSION_SECRET
# storage.encryption_key → env: AUTHELIA_STORAGE_ENCRYPTION_KEY
# totp.issuer → env: AUTHELIA_TOTP_ISSUER

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: ['*.{{ env "DOMAIN" }}', '{{ env "DOMAIN" }}']
      policy: one_factor

session:
  cookies:
    - name: authelia_session
      domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}/'
      expiration: 3600
      inactivity: 300

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notifications.txt
