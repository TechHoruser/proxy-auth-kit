###############################################################
#                     Users Database (plantilla)              #
###############################################################
# El setup copia este archivo a authelia/users_database.yml si no existe.
# El archivo real NO se versiona (se gestiona en runtime con: npm run control o el panel auth-admin).
#
# Usuario por defecto: admin / authelia  (cámbialo antes de exponer el servidor).
# Para generar un hash de contraseña manualmente:
#   docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password 'tucontraseña'

users:
  admin:
    displayname: "Admin"
    password: "$argon2id$v=19$m=65536,t=3,p=4$47u1WRgVE2+pqeY6P8UtwA$bJLxHCE2OicwWlm4lI3WjJrHFK+B4fIJMUFT8YcRUJw"
    email: admin@localhost.com
    groups:
      - admins
